name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A publicação diária e as publicações de código usam a MESMA fila,
# para não disputar o deployment único do GitHub Pages.
concurrency:
  group: missal-diario-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          # Sempre a versão mais recente do main: evita publicar um commit
          # antigo por cima dos dados que a atualização diária já salvou.
          ref: main

      - name: Instalar dependências para geração dos ícones
        run: python -m pip install -r requirements.txt

      - name: Gerar ícones PNG do PWA
        run: python scripts/build_app_icons.py

      - name: Otimizar logo da paróquia
        run: python scripts/build_brand_logo.py

      - name: Atualizar versão do site e cache do PWA
        run: python scripts/bump_daily_version.py

      - name: Gerar HTML completo a partir do site principal
        run: python scripts/build_standalone.py

      - name: Testar HTML, navegação e prévia de domingo
        run: python scripts/test_regressions.py

      - name: Conferir páginas com o índice do Missal Romano 2023
        run: python scripts/check_missal_references.py

      - name: Conferir qualidade de todos os dias, calendário e página
        run: python scripts/check_quality.py

      - name: Preparar Node para análise do código
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Analisar código (JavaScript, CSS e Python)
        run: |
          python -m pip install pyflakes==3.4.0
          npm ci --prefix scripts/lint --no-audit --no-fund
          python scripts/lint/lint_code.py
          rm -rf scripts/lint/node_modules   # não publicar dependências no site

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Publicar
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # O GitHub às vezes ainda não "enxerga" o pacote recém-enviado e a
      # publicação falha por alguns segundos. Espera e tenta de novo.
      - name: Aguardar o GitHub antes de tentar de novo
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Publicar de novo (2ª tentativa)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Confirmar versão pública (HTML, dados e status)
        run: python scripts/check_publication.py --expected-from-local
