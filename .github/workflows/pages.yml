name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A publicação diária e as publicações de código usam a MESMA fila,
# para não disputar o deployment único do GitHub Pages.
concurrency:
  group: missal-diario-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar dependências para geração dos ícones
        run: python -m pip install -r requirements.txt

      - name: Gerar ícones PNG do PWA
        run: python scripts/build_app_icons.py

      - name: Atualizar versão do site e cache do PWA
        run: python scripts/bump_daily_version.py

      - name: Gerar HTML completo a partir do site principal
        run: python scripts/build_standalone.py

      - name: Testar HTML, navegação e prévia de domingo
        run: python scripts/test_regressions.py

      - name: Conferir páginas com o índice do Missal Romano 2023
        run: python scripts/check_missal_references.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar versão pública (HTML, dados e status)
        run: python scripts/check_publication.py --expected-from-local
