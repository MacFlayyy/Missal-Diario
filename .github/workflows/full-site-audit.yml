name: Auditoria completa Missal Diário
on:
  workflow_dispatch:
  schedule:
    # O site troca de dia à meia-noite: a auditoria confere o dia novo logo
    # depois, ainda com tempo para as conferências da madrugada corrigirem.
    - cron: "20 3 * * *"   # 00:20 Brasília: confere o dia que acabou de ser liberado
    - cron: "40 4 * * *"   # 01:40 Brasília: segunda chance, caso o GitHub pule o horário anterior
    - cron: "30 9 * * *"   # 06:30 Brasília: confere de novo depois das conferências da manhã
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.js'
      - 'status.js'
      - 'sw.js'
      - 'scripts/test_regressions.py'
      - 'scripts/check_publication.py'
      - 'scripts/full-site-audit.cjs'
      - 'scripts/deep-visual-audit.cjs'
      - 'scripts/today-public-audit.cjs'
      - 'scripts/behavior-audit.cjs'
      - 'scripts/check_quality.py'
      - 'scripts/lint/**'
      - '.github/workflows/full-site-audit.yml'
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Os servidores de pacotes do Ubuntu às vezes ficam muito lentos e a
      # instalação dos navegadores de teste estourava o tempo. Guardamos os
      # navegadores e os pacotes do sistema para as próximas execuções.
      - name: Guardar navegadores de teste entre execuções
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/pw-debs
          key: playwright-1.56.1-${{ runner.os }}-ubuntu-24.04-v1
      - name: Preparar Chromium e WebKit
        timeout-minutes: 20
        run: |
          npm install --no-save playwright@1.56.1
          mkdir -p ~/pw-debs
          sudo cp -n ~/pw-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/80-missal >/dev/null
          for attempt in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium webkit; then break; fi
            echo "Tentativa $attempt de instalar os navegadores falhou ou demorou demais; tentando de novo..."
            sleep 20
          done
          npx playwright install chromium webkit
          cp -n /var/cache/apt/archives/*.deb ~/pw-debs/ 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar imagens e HTML de teste igual ao site publicado
        run: |
          python -m pip install cairosvg==2.8.2 Pillow==11.3.0
          python scripts/build_app_icons.py
          python scripts/build_brand_logo.py
          python scripts/build_standalone.py
      - name: Servir versão do repositório
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/missal-full-audit-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Executar auditoria integral
        run: node scripts/full-site-audit.cjs
      - name: Comportamento — todos os dias, pulos de layout, offline e virada da meia-noite
        if: always()
        run: node scripts/behavior-audit.cjs
      - name: Auditoria aprofundada de animação, datas especiais e acessibilidade
        if: always()
        run: node scripts/deep-visual-audit.cjs
      - name: Auditar site público de hoje em 8 telas
        if: always()
        run: node scripts/today-public-audit.cjs
      - name: Anexar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auditoria-completa-missal-diario
          path: |
            full-audit-results/
            deep-audit-results/
            today-audit-results/
          if-no-files-found: warn
          retention-days: 14
