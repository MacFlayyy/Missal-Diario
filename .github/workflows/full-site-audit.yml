name: Auditoria completa Missal Diário
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.js'
      - 'status.js'
      - 'sw.js'
      - 'scripts/test_regressions.py'
      - 'scripts/check_publication.py'
      - 'scripts/full-site-audit.cjs'
      - 'scripts/deep-visual-audit.cjs'
      - '.github/workflows/full-site-audit.yml'
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium e WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Servir versão do repositório
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/missal-full-audit-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Executar auditoria integral
        run: node scripts/full-site-audit.cjs
      - name: Auditoria aprofundada de animação, datas especiais e acessibilidade
        if: always()
        run: node scripts/deep-visual-audit.cjs
      - name: Anexar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-completa-missal-diario
          path: |
            full-audit-results/
            deep-audit-results/
          if-no-files-found: warn
          retention-days: 14
