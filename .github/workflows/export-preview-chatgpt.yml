name: Exportar preview ChatGPT

on:
  push:
    paths:
      - "preview-trigger.txt"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Empacotar HTML standalone
        uses: actions/upload-artifact@v4
        with:
          name: missal-diario-chatgpt
          path: Missal-Diario-Standalone.html
          if-no-files-found: error
          retention-days: 1
