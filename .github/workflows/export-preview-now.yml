name: Exportar preview atual agora

on:
  push:
    paths:
      - "preview-now-trigger.txt"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Empacotar HTML completo atual
        uses: actions/upload-artifact@v4
        with:
          name: missal-diario-chatgpt-v64
          path: Missal-Diario-Standalone.html
          if-no-files-found: error
          retention-days: 1
