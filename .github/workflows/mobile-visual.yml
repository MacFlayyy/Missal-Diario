name: Auditoria visual mobile - iPhone e Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-visual.yml'
      - 'index.html'
      - 'data.js'
      - 'status.js'
      - 'scripts/mobile-visual-audit.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Os servidores de pacotes do Ubuntu às vezes ficam muito lentos e a
      # instalação dos navegadores de teste estourava o tempo. Guardamos os
      # navegadores e os pacotes do sistema para as próximas execuções.
      - name: Guardar navegadores de teste entre execuções
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/pw-debs
          key: playwright-1.56.1-${{ runner.os }}-ubuntu-24.04-v1
      - name: Instalar Playwright
        timeout-minutes: 20
        run: |
          npm install --no-save playwright@1.56.1
          mkdir -p ~/pw-debs
          sudo cp -n ~/pw-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/80-missal >/dev/null
          for attempt in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium webkit; then break; fi
            echo "Tentativa $attempt de instalar os navegadores falhou ou demorou demais; tentando de novo..."
            sleep 20
          done
          npx playwright install chromium webkit
          cp -n /var/cache/apt/archives/*.deb ~/pw-debs/ 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar imagens e HTML de teste igual ao site publicado
        run: |
          python -m pip install cairosvg==2.8.2 Pillow==11.3.0
          python scripts/build_app_icons.py
          python scripts/build_brand_logo.py
          python scripts/build_standalone.py
      - name: Iniciar site local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/missal-audit-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Testar visual e interacoes em celulares
        run: node scripts/mobile-visual-audit.cjs
      - name: Guardar relatorio e capturas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-visual-celulares
          path: mobile-visual-results/
          if-no-files-found: warn
          retention-days: 14
