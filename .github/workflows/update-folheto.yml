name: Atualizar Missal Diário

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. 07:45 UTC = 04:45 em Brasília (UTC-3).
    # Prepara e valida antes das 05:00; o site libera o dia às 05:00.
    - cron: "45 7 * * *"

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'schedule' || github.actor == 'MacFlayyy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar folhetos e atualizar o site
        run: python scripts/update_folheto.py

      - name: Revisar e corrigir o Missal antes de publicar
        run: python scripts/validate_daily.py

      - name: Atualizar versão HTML do ChatGPT
        run: python scripts/build_standalone.py

      - name: Salvar alterações, se houver
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git config user.name "Missal Diário Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js status.js Missal-Diario-Standalone.html
          git commit -m "Atualiza Missal Diário"
          git push
