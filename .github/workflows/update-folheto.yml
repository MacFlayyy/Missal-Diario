name: Atualizar Missal Diário

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. Rodadas redundantes preparam o dia antes das 05:00.
    # O site mantém o conteúdo bloqueado até 05:00 em Brasília.
    - cron: "45 6 * * *"  # 03:45 Brasília
    - cron: "15 7 * * *"  # 04:15 Brasília
    - cron: "45 7 * * *"  # 04:45 Brasília

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    if: github.event_name == 'schedule' || github.actor == 'MacFlayyy'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar folhetos e atualizar o site
        run: python scripts/update_folheto.py

      - name: Revisar e corrigir o Missal antes de publicar
        run: python scripts/validate_daily.py

      - name: Atualizar versão HTML do ChatGPT
        run: python scripts/build_standalone.py

      - name: Salvar alterações, se houver
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git config user.name "Missal Diário Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js status.js Missal-Diario-Standalone.html
          git commit -m "Atualiza Missal Diário"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar imediatamente no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
