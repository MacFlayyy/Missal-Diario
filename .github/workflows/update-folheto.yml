name: Atualizar Missal Diário

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar folhetos e atualizar o site
        run: python scripts/update_folheto.py

      - name: Revisar e corrigir o Missal antes de publicar
        run: python scripts/validate_daily.py

      - name: Salvar alterações, se houver
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git config user.name "Missal Diário Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js status.js
          git commit -m "Atualiza Missal Diário"
          git push
