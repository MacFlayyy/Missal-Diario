name: Atualizar Missal Diário

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_folheto.py"
      - "scripts/ritos_texts.py"
      - "scripts/test_regressions.py"
      - "scripts/daily_pipeline.sh"
  schedule:
    # GitHub Actions usa UTC; Brasília é UTC-3.
    # Há tentativas antes e depois das 05:00 para tolerar atrasos do agendador.
    - cron: "0 7 * * *"   # 04:00 Brasília
    - cron: "30 7 * * *"  # 04:30 Brasília
    - cron: "50 7 * * *"  # 04:50 Brasília
    - cron: "0 8 * * *"   # 05:00 Brasília (tentativa principal)
    - cron: "10 8 * * *"  # 05:10 Brasília
    - cron: "30 8 * * *"  # 05:30 Brasília
    - cron: "0 9 * * *"   # 06:00 Brasília
    - cron: "0 14 * * *"  # 11:00 Brasília — novo folheto publicado durante a manhã
    - cron: "0 19 * * *"  # 16:00 Brasília — nova checagem à tarde
    - cron: "0 23 * * *"  # 20:00 Brasília — checagem noturna
    # Véspera: libera o dia seguinte com antecedência (o site só o mostra às 05h).
    # O GitHub costuma atrasar as execuções da madrugada em várias horas.
    - cron: "0 21 * * *"  # 18:00 Brasília
    - cron: "0 1 * * *"   # 22:00 Brasília
    - cron: "0 2 * * *"   # 23:00 Brasília

# Compartilhada com pages.yml: serializa o deploy do atualizador e do site.
concurrency:
  group: missal-diario-pages-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.actor == 'MacFlayyy'
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          # sempre a versão mais recente do site (execuções na fila não partem de uma cópia antiga)
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Cópia guardada dos pacotes do leitor de folhetos (OCR): se os servidores
      # do Ubuntu caírem, instala a partir dela.
      - name: Restaurar cópia do leitor de folhetos
        uses: actions/cache@v4
        with:
          path: ~/ocr-debs
          key: ocr-debs-${{ runner.os }}-noble-v1

      # Se o espelho do Ubuntu estiver fora do ar, usa a cópia guardada ou tenta de novo.
      # Sem o leitor (OCR), os folhetos ficam como estão e o dia é publicado normalmente.
      - name: Preparar OCR em português para PDFs digitalizados
        run: |
          ok() { command -v tesseract >/dev/null && command -v pdftoppm >/dev/null && tesseract --list-langs 2>/dev/null | grep -qx por; }
          mkdir -p ~/ocr-debs
          if ! ok && ls ~/ocr-debs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/ocr-debs/*.deb >/dev/null 2>&1 || true
          fi
          for attempt in 1 2 3; do
            ok && break
            sudo timeout 150 apt-get update -qq || true
            sudo timeout 150 apt-get install -y -qq -o APT::Keep-Downloaded-Packages=true tesseract-ocr tesseract-ocr-por poppler-utils || true
            ok && break
            echo "Tentativa $attempt de instalar o OCR falhou; aguardando para tentar de novo..."
            sleep 30
          done
          # guarda os pacotes baixados para a próxima vez
          sudo cp -n /var/cache/apt/archives/*.deb ~/ocr-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/ocr-debs || true
          if ok; then
            echo "SKIP_FOLHETO=0" >> "$GITHUB_ENV"
          else
            echo "::warning title=Leitor de folhetos indisponível::Não foi possível instalar o OCR (servidores do Ubuntu fora do ar). Os folhetos já aplicados foram mantidos e o dia foi publicado normalmente."
            echo "SKIP_FOLHETO=1" >> "$GITHUB_ENV"
          fi

      - name: Gerar ícones PNG do PWA
        run: python scripts/build_app_icons.py

      - name: Otimizar logo da paróquia
        run: python scripts/build_brand_logo.py

      # Gera o dia, aplica os folhetos e roda todas as verificações.
      # Se um folheto mal lido quebrar alguma verificação, publica o dia pelo
      # Missal (de novo com todas as verificações) e avisa no passo seguinte.
      - name: Gerar o dia, aplicar folhetos e verificar tudo
        id: pipeline
        run: bash scripts/daily_pipeline.sh

      - name: Avisar que um folheto não foi aplicado
        if: steps.pipeline.outputs.fallback == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Folheto não aplicado — $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body-file /tmp/folheto-falha.md || true
          fi

      - name: Salvar alterações no repositório
        run: |
          git config user.name "Missal Diário Bot"
          git config user.email "actions@users.noreply.github.com"
          # Se outra atualização chegou ao main durante esta execução, os arquivos
          # gerados entram em conflito. Nesse caso refaz o dia sobre a versão nova
          # (com todas as verificações) e tenta de novo.
          for attempt in 1 2 3; do
            if git diff --quiet; then
              echo "Arquivos do dia já estavam corretos."
              exit 0
            fi
            git add data.js status.js index.html sw.js Missal-Diario-Standalone.html
            git commit -q -m "Atualiza Missal Diário automaticamente"
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "::warning::O main mudou durante a execução (tentativa $attempt). Refazendo o dia sobre a versão mais recente."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            bash scripts/daily_pipeline.sh || exit 1
          done
          echo "::error::Não foi possível salvar depois de 3 tentativas."
          exit 1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar publicação pública
        run: python scripts/check_publication.py --expected-from-local
